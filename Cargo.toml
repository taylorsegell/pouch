[workspace]
resolver = "3"
members = ["crates/pouch-core", "crates/pouch-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taylorsegell/pouch"
homepage = "https://github.com/taylorsegell/pouch"
readme = "README.md"
authors = ["Taylor Segell"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
pouch-core = { path = "crates/pouch-core", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9.42"
toml = "1"
ignore = "0.4.33"
blake3 = "1.8.7"
nucleo-matcher = "0.3.1"
jiff = { version = "0.2.37", default-features = true }
thiserror = "2.0.21"
anyhow = "1"
tempfile = "3.27.0"
tracing = "0.1"
tracing-subscriber = "0.3"
insta = { version = "1.49.0", features = ["json", "redactions"] }
assert_cmd = "2.2.2"
predicates = "3"
proptest = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["termion"] }

# The profile cargo-dist builds release archives with (`dist` inherits `release`).
[profile.dist]
inherits = "release"
